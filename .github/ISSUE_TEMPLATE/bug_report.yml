name: Bug Report
description: Create a report to help us reproduce and fix an issue in EduVault.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in EduVault.
        Please provide detailed reproduction steps so maintainers can investigate effectively.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Precise steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: Target Scope
      description: Does this affect the current web prototype or the planned Stellar milestone?
      options:
        - Current Web Prototype
        - Stellar / Soroban Milestone
        - Both
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or Logs
      description: Attach relevant terminal output, browser console logs, or screenshots.
