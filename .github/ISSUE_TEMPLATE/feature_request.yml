name: "Feature Request"
description: "Suggest an idea, enhancement, or architectural proposal for EduVault."
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please outline your proposal. If you are requesting rewards, please use the **GrantFox / Stellar Reward Task** template instead.

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Need"
      description: "What problem does this feature solve?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the solution you'd like to see implemented."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or features you've considered."
    validations:
      required: false
